# Everything that is tied to the product lives here or in one string.
# The product name is «واریز پرداز» (Latin slug varizpardaz, domain varizpardaz.com). The display name is the string `brand_name` in
# app/src/main/res/values/strings.xml (this file is read as ISO-8859-1 by Gradle, so no Persian here). The server address is never in the app: it comes from the
# pairing QR code.
#
# The application id is FINAL: com.varizpardaz.listener (decided 2026-11-12; it replaced ir.opromo.listener before anything was released).
# Android treats another id as another app, so after the first release it can never change. The Kotlin packages follow it.
brand.applicationId=com.varizpardaz.listener
# A signed release build refuses to run while this is not true.
brand.applicationIdFinal=true
# Pairing deep link: <scheme>://<host>?v=1&base=...&code=...
# The scheme and host are fixed by the contract (contracts/device-api.md section 3) and the server prints them in its QR codes, so a
# neutral scheme needs a contract change and a matching server change; until then they stay here, in one place.
brand.pairScheme=paygate
brand.pairHost=pair
