# The version of the Android listener. This file is the single source of truth: a release is made by changing it in a
# commit and tagging that commit `android-v<versionName>` (the release workflow refuses a tag that does not match).
# versionCode must go up with every release (Android refuses an update with a lower or equal code); the server's
# `app_update.latest_version_code` and `min_version_code` are compared with it.
versionCode=1
versionName=1.0.0
